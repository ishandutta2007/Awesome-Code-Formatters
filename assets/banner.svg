<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" style="background:#090d16; border-radius:16px; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; overflow:hidden;">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1726" />
      <stop offset="50%" stop-color="#0b101b" />
      <stop offset="100%" stop-color="#070a10" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="accentViolet" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="accentEmerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#14b8a6" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.8" opacity="0.45" />
      <circle cx="0" cy="0" r="1.2" fill="#334155" opacity="0.6"/>
    </pattern>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    /* Continuous background pulse & scanning bar animation */
    @keyframes scanline {
      0% { transform: translateY(0px); opacity: 0; }
      15% { opacity: 0.6; }
      85% { opacity: 0.6; }
      100% { transform: translateY(360px); opacity: 0; }
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.25; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(1.08); }
    }
    @keyframes flowPill1 {
      0%, 100% { transform: translateX(0px); }
      50% { transform: translateX(12px); }
    }
    @keyframes flowPill2 {
      0%, 100% { transform: translateX(0px); }
      50% { transform: translateX(-12px); }
    }
    @keyframes codeStream {
      0% { stroke-dashoffset: 600; }
      100% { stroke-dashoffset: 0; }
    }
    .scanner {
      animation: scanline 7s ease-in-out infinite;
    }
    .orb1 {
      animation: pulseGlow 6s ease-in-out infinite;
      transform-origin: 200px 80px;
    }
    .orb2 {
      animation: pulseGlow 8s ease-in-out infinite 1s;
      transform-origin: 1000px 280px;
    }
    .pill-anim-1 {
      animation: flowPill1 4s ease-in-out infinite;
    }
    .pill-anim-2 {
      animation: flowPill2 4.5s ease-in-out infinite;
    }
    .stream-line {
      stroke-dasharray: 60, 20;
      animation: codeStream 12s linear infinite;
    }
  </style>

  <!-- Deep Canvas Background -->
  <rect width="1200" height="360" fill="url(#bgGlow)" />
  <rect width="1200" height="360" fill="url(#grid)" />

  <!-- Dynamic Glowing Orbs in Background -->
  <circle class="orb1" cx="220" cy="90" r="140" fill="#38bdf8" opacity="0.25" filter="url(#glow)" />
  <circle class="orb2" cx="980" cy="270" r="160" fill="#a855f7" opacity="0.22" filter="url(#glow)" />

  <!-- Dynamic Animated Scanline Effect in Background -->
  <rect class="scanner" x="0" y="0" width="1200" height="2" fill="url(#titleGrad)" opacity="0.4" />

  <!-- Stylized Decorative Code Syntax / Connection Rails (Background) -->
  <g opacity="0.22">
    <path class="stream-line" d="M 60 70 L 400 70 L 460 130 L 1140 130" fill="none" stroke="#38bdf8" stroke-width="1.5" />
    <path class="stream-line" d="M 60 290 L 740 290 L 800 230 L 1140 230" fill="none" stroke="#c084fc" stroke-width="1.5" />
  </g>

  <!-- Dynamic Language & Tool Badges / Visual Pills (Crisp Foreground Sides) -->
  <!-- Left Side Badges -->
  <g class="pill-anim-1" transform="translate(60, 115)">
    <!-- Pill 1: Rust/Biome -->
    <rect x="0" y="0" width="130" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" opacity="0.85"/>
    <circle cx="16" cy="16" r="4.5" fill="#38bdf8" />
    <text x="30" y="21" fill="#f8fafc" font-size="12" font-weight="600" letter-spacing="0.5">⚡ Biome</text>

    <!-- Pill 2: Ruff -->
    <rect x="0" y="44" width="120" height="32" rx="16" fill="#1e293b" stroke="#f43f5e" stroke-width="1.2" opacity="0.85"/>
    <circle cx="16" cy="60" r="4.5" fill="#f43f5e" />
    <text x="30" y="65" fill="#f8fafc" font-size="12" font-weight="600" letter-spacing="0.5">🐍 Ruff</text>

    <!-- Pill 3: Prettier -->
    <rect x="0" y="88" width="135" height="32" rx="16" fill="#1e293b" stroke="#a855f7" stroke-width="1.2" opacity="0.85"/>
    <circle cx="16" cy="104" r="4.5" fill="#a855f7" />
    <text x="30" y="109" fill="#f8fafc" font-size="12" font-weight="600" letter-spacing="0.5">✨ Prettier</text>
  </g>

  <!-- Right Side Badges -->
  <g class="pill-anim-2" transform="translate(1005, 115)">
    <!-- Pill 4: Black -->
    <rect x="0" y="0" width="135" height="32" rx="16" fill="#1e293b" stroke="#10b981" stroke-width="1.2" opacity="0.85"/>
    <circle cx="16" cy="16" r="4.5" fill="#10b981" />
    <text x="30" y="21" fill="#f8fafc" font-size="12" font-weight="600" letter-spacing="0.5">🖤 Black</text>

    <!-- Pill 5: dprint -->
    <rect x="15" y="44" width="120" height="32" rx="16" fill="#1e293b" stroke="#eab308" stroke-width="1.2" opacity="0.85"/>
    <circle cx="31" cy="60" r="4.5" fill="#eab308" />
    <text x="45" y="65" fill="#f8fafc" font-size="12" font-weight="600" letter-spacing="0.5">📦 dprint</text>

    <!-- Pill 6: ESLint -->
    <rect x="0" y="88" width="135" height="32" rx="16" fill="#1e293b" stroke="#6366f1" stroke-width="1.2" opacity="0.85"/>
    <circle cx="16" cy="104" r="4.5" fill="#6366f1" />
    <text x="30" y="109" fill="#f8fafc" font-size="12" font-weight="600" letter-spacing="0.5">🛡️ ESLint</text>
  </g>

  <!-- FOREGROUND HERO CONTENT (Unobscured, crisp, clean typography) -->
  <g text-anchor="middle">
    <!-- Super Title / Tag -->
    <rect x="495" y="44" width="210" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
    <text x="600" y="63" fill="#94a3b8" font-size="11.5" font-weight="700" letter-spacing="2">⚡ PRODUCTION TOOLCHAINS</text>

    <!-- Main Title -->
    <text x="600" y="135" fill="url(#titleGrad)" font-size="44" font-weight="900" letter-spacing="-1">Awesome Code Formatters</text>

    <!-- Subtitle / Value Proposition -->
    <text x="600" y="178" fill="#e2e8f0" font-size="16" font-weight="500" letter-spacing="0.2">
      Curated Multi-Language Formatters, Opinionated Toolchains &amp; CI/CD Quality Gates
    </text>

    <!-- Secondary Meta Description -->
    <text x="600" y="210" fill="#94a3b8" font-size="13.5" font-weight="400">
      Zero Style Debates • Blazing Fast Rust Engines • Deterministic Code Quality
    </text>

    <!-- Center Interactive Metric Pills -->
    <g transform="translate(370, 246)">
      <rect x="0" y="0" width="140" height="36" rx="8" fill="#111827" stroke="#1f2937" stroke-width="1.2"/>
      <text x="70" y="23" fill="#38bdf8" font-size="12" font-weight="700">🚀 Multi-Language</text>

      <rect x="160" y="0" width="140" height="36" rx="8" fill="#111827" stroke="#1f2937" stroke-width="1.2"/>
      <text x="230" y="23" fill="#a855f7" font-size="12" font-weight="700">⚙️ CI/CD Enforced</text>

      <rect x="320" y="0" width="140" height="36" rx="8" fill="#111827" stroke="#1f2937" stroke-width="1.2"/>
      <text x="390" y="23" fill="#10b981" font-size="12" font-weight="700">🔒 Production-Ready</text>
    </g>
  </g>
</svg>
